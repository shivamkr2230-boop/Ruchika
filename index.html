<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shivam's Love</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400;1,9..144,600&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#120c2b;--plum:#2b1556;--gold:#ffd98a;--glow:#ff8fb1;--mist:#ece4ff;--paper:#fff8ea;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Nunito',sans-serif;color:var(--mist);overflow:hidden;
    background:radial-gradient(120% 80% at 50% 110%,#5a2a73 0,transparent 60%),radial-gradient(90% 60% at 80% -10%,#3a2380 0,transparent 55%),var(--ink)}
  #sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
  .moon{position:fixed;top:max(.8rem,env(safe-area-inset-top));right:5vw;width:clamp(38px,10vw,60px);aspect-ratio:1;border-radius:50%;z-index:0;
    background:radial-gradient(circle at 35% 35%,#fff6d8,var(--gold) 70%);box-shadow:0 0 50px 12px rgba(255,217,138,.35),0 0 140px 40px rgba(255,143,177,.15);
    -webkit-mask:radial-gradient(circle at 72% 40%,transparent 0 46%,#000 47%);mask:radial-gradient(circle at 72% 40%,transparent 0 46%,#000 47%)}
  h1,h2{font-family:'Fraunces',serif;font-weight:700;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
  .step{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:max(1.5rem,env(safe-area-inset-top)) 1.5rem max(1.5rem,env(safe-area-inset-bottom));gap:1.1rem}
  .step.active{display:flex;animation:rise .7s cubic-bezier(.2,.9,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97);filter:blur(6px)}}
  .step h1{font-size:clamp(2rem,8vw,3.2rem)}
  .step h2{font-size:clamp(1.7rem,7vw,2.6rem)}
  .sub{max-width:30ch;opacity:.78;font-size:1rem}

  .btn{font:700 1.05rem 'Nunito',sans-serif;border:0;border-radius:999px;padding:.9rem 2rem;cursor:pointer;color:#2a1033;
    background:linear-gradient(180deg,#ffe6a8,var(--gold));box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,0 8px 30px rgba(255,217,138,.35);transition:transform .15s,box-shadow .15s}
  .btn:active{transform:scale(.95)}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .btn.soft{background:rgba(255,255,255,.08);color:var(--mist);box-shadow:0 0 0 1px rgba(236,228,255,.35) inset;backdrop-filter:blur(6px)}

  /* puppy */
  .bubble{font-family:'Fraunces',serif;font-style:italic;font-size:1.45rem;background:rgba(255,255,255,.1);border:1px solid rgba(236,228,255,.3);
    backdrop-filter:blur(8px);border-radius:22px;padding:.7rem 1.2rem;position:relative;max-width:22ch}
  .bear{width:min(52vw,210px);cursor:pointer;animation:bob 3s ease-in-out infinite;touch-action:manipulation;filter:drop-shadow(0 0 28px rgba(255,143,177,.45))}
  .bear.boing{animation:boing .45s}
  @keyframes bob{50%{transform:translateY(-9px) rotate(-2deg)}}
  @keyframes boing{30%{transform:scale(1.15,.85)}60%{transform:scale(.92,1.1)}}
  .dots{display:flex;gap:.9rem}
  .dots i{width:14px;height:14px;background:#fff;opacity:.3;transition:.4s;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
  .dots i.on{background:var(--gold);opacity:1;transform:scale(1.6) rotate(72deg);filter:drop-shadow(0 0 6px var(--gold))}
  .tear{display:none}.sad .tear{display:block}.sad .tongue{display:none}

  /* envelope */
  .env{width:min(72vw,280px);aspect-ratio:1.4;position:relative;cursor:pointer;animation:bob 3s ease-in-out infinite;touch-action:manipulation;filter:drop-shadow(0 0 30px rgba(255,217,138,.5))}
  .env .body{position:absolute;inset:0;background:var(--paper);border-radius:14px}
  .env .flap{position:absolute;left:0;right:0;top:0;height:56%;background:#f1dfb8;clip-path:polygon(0 0,100% 0,50% 100%);border-radius:14px 14px 0 0}
  .env .seal{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-size:2.2rem}
  .letter{background:var(--paper);color:#3a2150;border-radius:16px;padding:1.6rem 1.5rem;max-width:min(88vw,30rem);text-align:left;white-space:pre-wrap;
    box-shadow:0 0 60px rgba(255,217,138,.25),0 20px 50px rgba(0,0,0,.4);font-family:'Fraunces',serif;font-size:1.15rem;line-height:1.65;min-height:9rem}
  .caret{display:inline-block;width:2px;height:1.1em;background:var(--glow);vertical-align:-.15em;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  #s3{padding-top:max(3.6rem,calc(env(safe-area-inset-top) + 3rem));gap:.8rem}
  #memTitle{font-size:clamp(1.05rem,4.4vw,1.35rem);font-style:italic;font-weight:600;line-height:1.4;max-width:30ch}
  #s3 .stack{width:min(54vw,220px);margin:.2rem 0 .6rem}
  /* polaroids */
  .stack{position:relative;width:min(68vw,260px);aspect-ratio:3/4.1;margin:.5rem 0 1rem}
  .card{position:absolute;inset:0;background:var(--paper);color:#3a2150;border-radius:6px;padding:.7rem .7rem 0;box-shadow:0 14px 36px rgba(0,0,0,.5);
    transform:rotate(var(--r));transition:transform .6s cubic-bezier(.2,1.1,.4,1),opacity .5s;cursor:pointer;touch-action:manipulation}
  .card .ph{height:calc(100% - 3.3rem);border-radius:3px;background:var(--plum) center/cover;display:grid;place-items:center;font-size:.9rem;color:var(--mist)}
  .card p{font-family:'Fraunces',serif;font-style:italic;font-size:1.1rem;padding-top:.55rem}
  .card.fly{transform:translate(-30%,-140%) rotate(-30deg);opacity:0}

  /* question */
  .choices{display:flex;flex-direction:column;align-items:center;gap:1.4rem;margin-top:.5rem}
  #yes{font-size:1.3rem}
  #no{font-size:.95rem;padding:.6rem 1.3rem;transition:left .25s ease,top .25s ease}
  .bigbear{width:min(44vw,170px)}
  #heart{width:min(70vw,300px);overflow:visible}
  #heart line{stroke:var(--gold);stroke-width:.35;stroke-linecap:round;stroke-dasharray:20;stroke-dashoffset:20;animation:draw .5s forwards;filter:drop-shadow(0 0 1px var(--gold))}
  #heart circle{fill:#fff;opacity:0;animation:star .5s forwards;filter:drop-shadow(0 0 2px var(--gold))}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes star{to{opacity:1}}
  .cele h2{font-size:clamp(2rem,9vw,3.4rem)}
  .petal{position:fixed;top:-2rem;pointer-events:none;z-index:50;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
  @media (prefers-reduced-motion:reduce){.bear,.env{animation:none}.petal{display:none}.step.active{animation:none}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="moon" aria-hidden="true"></div>

<main class="step active" id="s1">
  <div class="bubble" id="bubble1"></div>
  <svg class="bear" id="bear1" viewBox="0 0 200 200" role="button" aria-label="Tap the puppy">
    <ellipse cx="36" cy="100" rx="25" ry="50" fill="#a8683c" transform="rotate(14 36 100)"/>
    <ellipse cx="164" cy="100" rx="25" ry="50" fill="#a8683c" transform="rotate(-14 164 100)"/>
    <circle cx="100" cy="106" r="70" fill="#f6dfbb"/>
    <circle cx="130" cy="94" r="23" fill="#c98a58" opacity=".85"/>
    <ellipse cx="100" cy="134" rx="35" ry="27" fill="#fff8ec"/>
    <ellipse cx="100" cy="121" rx="12" ry="8.5" fill="#3a2020"/>
    <ellipse cx="96" cy="118" rx="4" ry="2.4" fill="#fff" opacity=".7"/>
    <path d="M100 128 V138" stroke="#3a2020" stroke-width="3" stroke-linecap="round"/>
    <circle cx="72" cy="98" r="8.5" fill="#3b1c1c"/><circle cx="75" cy="95" r="2.8" fill="#fff"/>
    <circle cx="128" cy="98" r="8.5" fill="#3b1c1c"/><circle cx="131" cy="95" r="2.8" fill="#fff"/>
    <ellipse cx="54" cy="122" rx="11" ry="7" fill="#ff9db8" opacity=".55"/>
    <ellipse cx="146" cy="122" rx="11" ry="7" fill="#ff9db8" opacity=".55"/>
    <path class="tongue" d="M94 148 q6 18 12 0 z" fill="#ff7f9c"/>
    <path class="mouth" d="M84 139 Q92 151 100 139 Q108 151 116 139" stroke="#3a2020" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path class="tear" d="M66 112 q-6 14 0 18 q6 -4 0 -18z" fill="#8fd3ff"/>
  </svg>
  <div class="dots" id="dots1"><i></i><i></i><i></i></div>
  <p class="sub" id="hint1"></p>
</main>

<main class="step" id="s2">
  <div id="envWrap" style="display:flex;flex-direction:column;align-items:center;gap:1.3rem">
    <h2 id="envTitle"></h2>
    <div class="env" id="env" role="button" aria-label="Open the letter"><div class="body"></div><div class="flap"></div><div class="seal">💌</div></div>
    <p class="sub">Tap the envelope</p>
  </div>
  <div class="letter" id="letter" style="display:none"></div>
  <button class="btn" id="next2" style="display:none">Keep going</button>
</main>

<main class="step" id="s3">
  <h2 id="memTitle"></h2>
  <div class="stack" id="stack"></div>
  <p class="sub" id="photoHint">Tap the photo to see the next one</p>
  <button class="btn" id="next3" style="display:none">One last thing</button>
</main>

<main class="step" id="s4">
  <div id="ask" style="display:flex;flex-direction:column;align-items:center;gap:1rem">
    <span id="bear4slot"></span>
    <h1 id="askTitle"></h1>
    <div class="choices">
      <button class="btn" id="yes">Yes 💖</button>
      <button class="btn soft" id="no">No</button>
    </div>
  </div>
  <div class="cele" id="cele" style="display:none;flex-direction:column;align-items:center;gap:1rem">
    <svg id="heart" viewBox="-20 -19 40 38" aria-hidden="true"></svg>
    <h2 id="yesTitle"></h2>
    <p class="sub" id="yesSub"></p>
  </div>
</main>

  try { if (sessionStorage.getItem("opened")) return; sessionStorage.setItem("opened", "1"); } catch (e) {}
  notify(CONFIG.herName + " opened your page", "She just opened it. Fingers crossed!", "eyes");
})();

/* ---- night sky: twinkling stars + an occasional shooting star ---- */
(() => {
  const c = $("sky"), x = c.getContext("2d"); let W, H, stars = [], shoot = null, next = 3000;
  function size() {
    const d = devicePixelRatio || 1; W = c.width = innerWidth * d; H = c.height = innerHeight * d;
    stars = Array.from({ length: Math.round(innerWidth * innerHeight / 5500) }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.3 + .3) * d,
      p: Math.random() * 6.28, s: Math.random() * 1.6 + .4, g: Math.random() < .12 }));
  }
  function frame(t) {
    x.clearRect(0, 0, W, H);
    for (const s of stars) {
      const a = calm ? .7 : .45 + .55 * Math.sin(t / 1000 * s.s + s.p);
      x.globalAlpha = Math.max(.1, a); x.fillStyle = s.g ? "#ffd98a" : "#fff";
      x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.28); x.fill();
    }
    if (!calm) {
      if (!shoot && t > next) { shoot = { x: Math.random() * W * .8 + W * .2, y: Math.random() * H * .35, l: 0 }; }
      if (shoot) {
        shoot.l += 14; shoot.x -= 9; shoot.y += 5;
        const g = x.createLinearGradient(shoot.x, shoot.y, shoot.x + shoot.l * .9, shoot.y - shoot.l * .5);
        g.addColorStop(0, "rgba(255,255,255,.95)"); g.addColorStop(1, "rgba(255,255,255,0)");
        x.globalAlpha = 1; x.strokeStyle = g; x.lineWidth = 2 * (devicePixelRatio || 1);
        x.beginPath(); x.moveTo(shoot.x, shoot.y); x.lineTo(shoot.x + shoot.l * .9, shoot.y - shoot.l * .5); x.stroke();
        if (shoot.l > 160 || shoot.x < 0) { shoot = null; next = t + 4000 + Math.random() * 5000; }
      }
      requestAnimationFrame(frame);
    }
  }
  size(); addEventListener("resize", size); requestAnimationFrame(frame);
})();

function go(n) {
  document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
  $("s" + n).classList.add("active");
}
const mood = (svg, happy) => {
  svg.querySelector(".mouth").setAttribute("d", happy ? "M84 139 Q92 151 100 139 Q108 151 116 139" : "M86 150 Q100 138 114 150");
  svg.classList.toggle("sad", !happy);
};

const b4 = $("bear1").cloneNode(true);
b4.id = "bear4"; b4.classList.add("bigbear"); b4.removeAttribute("role");
$("bear4slot").replaceWith(b4);

$("bubble1").textContent = swap(CONFIG.hello);
$("hint1").textContent = CONFIG.hint1;
$("envTitle").textContent = CONFIG.envTitle;
$("memTitle").textContent = CONFIG.memoriesTitle;
$("askTitle").textContent = CONFIG.askTitle;
$("yesTitle").textContent = CONFIG.yesTitle;
$("yesSub").textContent = swap(CONFIG.yesSub);

/* Step 1: tap the puppy 3 times, each tap lights a star */
let taps = 0;
$("bear1").addEventListener("click", () => {
  taps++;
  const b = $("bear1"); b.classList.remove("boing"); void b.getBoundingClientRect(); b.classList.add("boing");
  document.querySelectorAll("#dots1 i").forEach((d, i) => d.classList.toggle("on", i < taps));
  const lines = ["Woof! Again!", "One more tap...", "Yay! Come with me 💌"];
  $("bubble1").textContent = lines[Math.min(taps, 3) - 1];
  if (taps === 3) setTimeout(() => go(2), 900);
});

/* Step 2: envelope + typing letter */
$("env").addEventListener("click", () => {
  $("envWrap").style.display = "none";
  const L = $("letter"); L.style.display = "block";
  const text = swap(CONFIG.letter) + "\n\n- " + CONFIG.yourName;
  let i = 0; L.innerHTML = '<span id="typed"></span><span class="caret"></span>';
  const t = setInterval(() => {
    $("typed").textContent = text.slice(0, ++i);
    if (i >= text.length) { clearInterval(t); $("next2").style.display = "inline-block"; }
  }, 32);
  L.onclick = () => { i = text.length; };
});
$("next2").onclick = () => go(3);

/* Step 3: polaroids drift off one by one */
const stack = $("stack");
CONFIG.photos.slice().reverse().forEach((p, idx, arr) => {
  const c = document.createElement("div");
  c.className = "card";
  c.style.setProperty("--r", (idx === arr.length - 1 ? -2 : (idx % 2 ? 4 : -5)) + "deg");
  c.innerHTML = '<div class="ph"></div>';
  const ph = c.querySelector(".ph");
  const img = new Image();
  img.onload = () => { ph.style.backgroundImage = `url("${p.src}")`; ph.style.backgroundPosition = p.pos || "center"; };
  img.onerror = () => ph.textContent = "Add a photo 📷";
  img.src = p.src;
  stack.append(c);
});
let flown = 0;
stack.addEventListener("click", () => {
  const cards = [...stack.querySelectorAll(".card:not(.fly)")];
  if (!cards.length) return;
  cards[cards.length - 1].classList.add("fly");
  if (++flown >= CONFIG.photos.length) {
    $("photoHint").textContent = "That's all of them 🥹";
    $("next3").style.display = "inline-block";
  }
});
$("next3").onclick = () => go(4);

/* Step 4: the question ("No" runs away, "Yes" grows) */
let nos = 0, lastDodge = 0;
const noBtn = $("no");
function dodge(e) {
  if (e && e.cancelable) e.preventDefault();
  const now = Date.now();
  if (now - lastDodge < 250) return;
  lastDodge = now; nos++;
  const msgs = CONFIG.noMessages;
  noBtn.textContent = msgs[Math.min(nos, msgs.length - 1)];
  mood($("bear4"), false);
  $("yes").style.transform = `scale(${Math.min(1 + nos * .12, 1.8)})`;
  $("yes").style.marginTop = Math.min(nos * 6, 30) + "px";
  noBtn.style.position = "fixed"; noBtn.style.zIndex = 5;
  const pad = 12;
  const maxX = innerWidth - noBtn.offsetWidth - pad, maxY = innerHeight - noBtn.offsetHeight - pad;
  const yr = $("yes").getBoundingClientRect();
  let x, y, tries = 0;
  do {
    x = pad + Math.random() * Math.max(0, maxX - pad);
    y = pad + Math.random() * Math.max(0, maxY - pad);
    tries++;
  } while (tries < 30 && x < yr.right + 10 && x + noBtn.offsetWidth > yr.left - 10 && y < yr.bottom + 10 && y + noBtn.offsetHeight > yr.top - 10);
  noBtn.style.left = x + "px"; noBtn.style.top = y + "px";
}
noBtn.addEventListener("pointerenter", dodge);
noBtn.addEventListener("pointerdown", dodge);
noBtn.addEventListener("click", dodge);
noBtn.addEventListener("touchstart", dodge, { passive: false });

/* Yes: the stars connect into a heart, then petals fall */
$("yes").addEventListener("click", () => {
  notify(CONFIG.herName + " said YES!", "She said yes!" + (nos ? " (after trying No " + nos + " time" + (nos > 1 ? "s" : "") + ")" : ""), "tada,heart", 5);
  $("ask").style.display = "none"; noBtn.style.display = "none";
  $("cele").style.display = "flex";
  const n = 14, pts = Array.from({ length: n }, (_, i) => {
    const t = i / n * 6.2832;
    return [16 * Math.sin(t) ** 3, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))];
  });
  let svg = "";
  pts.forEach((p, i) => {
    const q = pts[(i + 1) % n], d = (i * .22).toFixed(2);
    svg += `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" style="animation-delay:${d}s"/>`;
  });
  pts.forEach((p, i) => svg += `<circle cx="${p[0]}" cy="${p[1]}" r="${i % 3 ? .7 : 1.1}" style="animation-delay:${(i * .22).toFixed(2)}s"/>`);
  $("heart").innerHTML = svg;
  const em = ["🌹", "💖", "✨", "🌸", "🧸", "💕"];
  for (let i = 0; i < 50; i++) {
    const s = document.createElement("span");
    s.className = "petal"; s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = 18 + Math.random() * 20 + "px";
    s.style.animationDuration = 3 + Math.random() * 3 + "s";
    s.style.animationDelay = Math.random() * 1.5 + "s";
    document.body.append(s); setTimeout(() => s.remove(), 8000);
  }
});
</script>
